# Controlled vocabularies for user-stories.tsv.
# The app and the tests read this file; a story that uses a value not listed here is rejected.

# OME-Zarr versions each story is assessed against. Each one is a `status_<version>` column
# in the TSV, so adding a version here means adding that column to the file too.
# Keep the quotes, or YAML reads 0.6 as a number.
spec_versions: ["0.6", "0.9dev"]

# How well each spec version supports a story, from least to most supported; the table sorts
# in this order. The first one is the default for a new story.
#   colour: one of grey, pink, violet, red, orange, yellow, blue, amber, teal, green
#   solved: whether "Hide solved" hides stories with this status
statuses:
  - name: Unassessed
    colour: grey
    solved: false
    description: Nobody has looked at this yet.
  - name: Unsure
    colour: pink
    solved: false
    description: Looked at, but which level applies is unclear. Needs discussion.
  - name: Breaking
    colour: red
    solved: false
    description: Cannot be done without violating the spec.
  - name: Out of spec
    colour: orange
    solved: false
    description: >-
      Valid OME-Zarr only through custom attributes or side files; other tools
      won't understand it.
  - name: Awkward
    colour: yellow
    solved: false
    description: >-
      The spec allows it only by bending features beyond their intent, e.g. dummy
      axes, splitting one image into several, or encoding simple transforms as fields.
  - name: Possible
    colour: blue
    solved: false
    description: >-
      General spec features express it as they are meant to be used, though nothing
      is dedicated to it.
  - name: Community extension
    colour: violet
    solved: false
    description: >-
      A published extension using the RFC-8 mechanism, maintained outside the spec.
      Readers know it is there, but support varies by tool.
  - name: Core extension
    colour: teal
    solved: true
    description: >-
      Spec-maintained metadata outside the core: transitional metadata today
      (e.g. omero, bioformats2raw.layout), official RFC-8 extensions later.
  - name: Core
    colour: green
    solved: true
    description: Explicitly specified in the core spec.

# Who a story is for. A story can list several (or none, until it is triaged).
user_classes:
  - name: Bioimage analyst
    description: Analyses images, e.g. segmentation, tracking, registration, quantification.
  - name: Data scientist
    description: Runs machine learning or large-scale analysis across many datasets.
  - name: Data producer
    description: Acquires or converts images and shares them, e.g. microscopists and facilities.
  - name: Data manager
    description: Curates, hosts or archives data, e.g. data stewards and repository teams.
  - name: Tool developer
    description: Builds or maintains viewers, libraries, pipelines or methods that read or write OME-Zarr.
  - name: Researcher
    description: Opens and explores images to answer a scientific question, without writing code.
